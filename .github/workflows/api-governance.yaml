name: API Governance Review (reusable)

on:
  workflow_call:
    inputs:
      contracts_path:
        description: >
          Patron glob de contratos OpenAPI a revisar, relativo a la raíz
          del repo. Acepta múltiples patrones separados por coma.
          Ejemplo: 'contracts/**/*.yaml,specs/**/*.json'
        type: string
        default: '**/*.yaml,**/*.yml,**/*.json'
      codigos:
        description: >
          Códigos de reglas a evaluar, separados por coma.
          Si se omite, se evalúan todas las reglas activas.
          Calculadas: R-GENM02, R-DATM01, R-DATM04
          Verificación: R-GENM01, R-OPEM01, R-DATM02, R-DATM05
          Ejemplo: 'R-DATM01,R-GENM02'
        type: string
        default: ''
      copilot_model:
        description: 'Modelo de Copilot a utilizar'
        type: string
        default: 'gpt-4o'
    # No se declaran secrets explícitos: el caller usa `secrets: inherit`,
    # lo que pasa GITHUB_TOKEN automáticamente y evita la colisión con el
    # nombre reservado `github_token` que GitHub no permite en workflow_call.

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Revisar contratos OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # necesario para git diff y --rama

      - name: Checkout del skill de gobernanza
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/api-governance
          path: _skill
          # token: ${{ secrets.SKILLS_REPO_TOKEN }}  # descomentar si el repo es privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot
        # @github/copilot lee GITHUB_TOKEN del entorno directamente.
        # No tiene subcomando auth login — la autenticación es implícita.

      - name: Detectar contratos OpenAPI modificados
        id: detect
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          echo "Base branch : $BASE"
          echo "HEAD commit : $(git rev-parse --short HEAD)"

          # Garantizar que la rama base esté disponible como origin/<base>
          git fetch origin "$BASE" --depth=1 2>/dev/null \
            || git fetch origin --depth=1 2>/dev/null || true
          echo "origin/$BASE → $(git rev-parse --short origin/$BASE 2>/dev/null || echo 'no encontrado')"

          # Listar todos los archivos añadidos/modificados/renombrados en el PR
          # (sin filtro de path en git diff para evitar el bug de múltiples --)
          CHANGED=$(git diff --name-only --diff-filter=AMR \
            "origin/${BASE}...HEAD" \
            | grep -v '^\.github/' || true)

          echo "--- Archivos modificados en el PR ---"
          echo "${CHANGED:-  (ninguno)}"
          echo "-------------------------------------"

          # Filtrar por prefijo de los patrones de inputs.contracts_path
          # y verificar que el archivo tenga contenido OpenAPI
          PATTERNS="${{ inputs.contracts_path }}"
          OAS_FILES=""

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Verificar que el archivo existe localmente
            if [ ! -f "$f" ]; then
              echo "  [skip] no existe en disco: $f"
              continue
            fi

            # Verificar que algún patrón coincide (usando prefijo pre-glob)
            MATCH=false
            IFS=',' read -ra PARTS <<< "$PATTERNS"
            for p in "${PARTS[@]}"; do
              p="${p// /}"                  # quitar espacios
              prefix="${p%%\**}"            # extraer prefijo antes del primer *
              if [[ "$f" == "$prefix"* ]]; then
                MATCH=true; break
              fi
            done

            if ! $MATCH; then
              echo "  [skip] fuera de patterns: $f"
              continue
            fi

            # Verificar que es un contrato OpenAPI (YAML: 'openapi:' / JSON: '"openapi":')
            if grep -qiE '^\s*(openapi\s*:|"openapi"\s*:)' "$f" 2>/dev/null; then
              echo "  [ok]   contrato OpenAPI: $f"
              OAS_FILES="${OAS_FILES}${f}\n"
            else
              echo "  [skip] no es OpenAPI: $f"
            fi
          done <<< "$CHANGED"

          COUNT=$(printf "%b" "$OAS_FILES" | grep -c '.' || true)
          echo "Contratos OpenAPI detectados: $COUNT"

          echo "contracts<<EOF" >> $GITHUB_OUTPUT
          printf "%b" "$OAS_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT

      # run_review.py:
      #   Fase 1: corre extraer_contexto.py (reglas calculadas + preguntas verificación)
      #   Fase 2: pasa contexto.md como prompt a `copilot -p "..."` (modo no-interactivo)
      #   Fase 3: publica tabla de hallazgos en el PR
      - name: "Análisis híbrido y publicar hallazgos"
        if: steps.detect.outputs.count != '0'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ steps.detect.outputs.base }}
          CONTRACTS: ${{ steps.detect.outputs.contracts }}
          REPO: ${{ github.repository }}
          COPILOT_MODEL: ${{ inputs.copilot_model }}
          CODIGOS: ${{ inputs.codigos }}
          SKILL_BASE: _skill
        run: |
          echo "COPILOT_GITHUB_TOKEN=$COPILOT_GITHUB_TOKEN"
          echo "GITHUB_TOKEN=$GITHUB_TOKEN"
          python _skill/.github/scripts/run_review.py

      - name: Sin contratos OpenAPI detectados
        if: steps.detect.outputs.count == '0'
        run: echo "No se encontraron contratos OpenAPI modificados. Revisión omitida."
